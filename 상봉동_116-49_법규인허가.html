<style>
:root{
  --bg:#f4f2ee; --panel:#fff; --ink:#1d2326; --muted:#5f6b70; --line:#d9d5cc; --chip:#eef1f3;
  --accent:#1f4fd1; --ok:#1f7a4c; --warn:#b26a00; --bad:#d92d20; --proc:#6b4fd1; --na:#8a949a; --askc:#f0507a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15191b; --panel:#1d2225; --ink:#e7ecee; --muted:#9aa6ab; --line:#333b3f; --chip:#262d31;
  --accent:#7aa2ff; --ok:#5fd39a; --warn:#f0b44c; --bad:#ff6b5e; --proc:#a993ff; --na:#7d878c;}}
:root[data-theme="dark"]{
  --bg:#15191b; --panel:#1d2225; --ink:#e7ecee; --muted:#9aa6ab; --line:#333b3f; --chip:#262d31;
  --accent:#7aa2ff; --ok:#5fd39a; --warn:#f0b44c; --bad:#ff6b5e; --proc:#a993ff; --na:#7d878c;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
header .sub{color:var(--muted);font-size:12px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)} .btn.sm{padding:3px 8px;font-size:12px}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block} .save.ok i{background:var(--ok)} .save.pending i{background:var(--warn)} .save.err i{background:var(--bad)}
nav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 8px}
nav h2,aside h2{font-size:12px;color:var(--muted);margin:14px 4px 6px;font-weight:700} nav h2:first-child,aside h2:first-child{margin-top:2px}
.cat{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1.5px solid transparent}
.cat:hover{background:var(--chip)} .cat.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.cat span{flex:1}
.dots{display:flex;gap:3px}
.dot{min-width:17px;height:17px;border-radius:999px;font-size:10.5px;font-weight:800;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:none}
.kpi{padding:6px 12px!important} .kpi b{font-size:19px!important}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums} .kpi span{font-size:12px;color:var(--muted)}
.kpi.on{outline:2px solid var(--accent)}
h3.grp{font-size:14px;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
h3.grp small{color:var(--muted);font-weight:400}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12.5px}
th{color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--chip) 60%,var(--panel))}
tr.row{cursor:pointer} tr.row:hover td{background:color-mix(in srgb,var(--chip) 55%,transparent)} tr.row.sel td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
td.v{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;color:#fff}
.s-ok{background:var(--ok)} .s-bad{background:var(--bad)} .s-chk{background:var(--warn)} .s-proc{background:var(--proc)} .s-na{background:var(--na)}
.ov{font-size:10.5px;color:var(--accent);font-weight:700;margin-left:4px}
.src a{font-size:11.5px}
.law{color:var(--muted);font-size:11.5px}

.info{display:grid;grid-template-columns:78px 1fr;gap:5px 8px;font-size:12.5px} .info span{color:var(--muted)}
.box{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer}
.seg button.on{border-color:var(--accent);font-weight:800}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);resize:vertical}
.asm{display:grid;grid-template-columns:1fr 74px 40px;gap:4px 6px;align-items:center;font-size:12px}
.asm input{width:100%;border:1px solid var(--line);border-radius:6px;padding:2px 5px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.asm .lb{line-height:1.25} .asm .lb small{display:block;color:var(--muted);font-size:10.5px}
.road{display:flex;gap:0;overflow-x:auto;padding:4px 2px 8px}
.step{flex:1;min-width:150px;position:relative;padding:10px 12px 10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-right:16px}
.step:not(:last-child)::after{content:"";position:absolute;right:-13px;top:50%;border:6px solid transparent;border-left:8px solid var(--line);transform:translateY(-50%)}
.step b{display:block;font-size:12.5px} .step small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
.step.on{border-color:var(--proc);box-shadow:0 0 0 2px color-mix(in srgb,var(--proc) 20%,transparent)} .step.off{opacity:.45}
.empty{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 13px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.app{display:grid;grid-template-columns:170px minmax(0,1fr) 440px;grid-template-rows:auto minmax(0,1fr);height:100vh}
main{overflow:hidden;padding:12px 14px 96px;display:flex;flex-direction:column;gap:10px;min-height:0}
.planbox{position:relative;flex:1;min-height:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.planbox svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.lfloors{position:absolute;left:8px;top:8px;right:70px;display:flex;flex-wrap:wrap;gap:3px;z-index:2}
.lfloors button{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:6px;padding:1px 7px;font-size:11.5px;cursor:pointer}
.lfloors button.on{border-color:var(--accent);color:var(--accent);font-weight:800}
.lfloors .sep{width:8px}
.lfit{position:absolute;right:8px;top:8px}
.lcap{position:absolute;left:8px;right:8px;bottom:8px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:hidden;padding:10px 12px 92px;display:flex;flex-direction:column;min-height:0}
#lsel{flex:none;max-height:46%;overflow:auto;margin-bottom:8px}
.card.tabcard{display:flex;flex-direction:column;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:6px 9px;border-bottom:2.5px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabbody{flex:1;overflow:auto;min-height:0}
.lgrp{font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px 3px;background:color-mix(in srgb,var(--chip) 50%,var(--panel));position:sticky;top:0}
.lrow{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.lrow:hover{background:color-mix(in srgb,var(--chip) 55%,transparent)} .lrow.sel{background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.lrow .pill{flex:none;margin-top:1px;min-width:62px;text-align:center}
.pri{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:0 4px;color:#fff;background:var(--na);vertical-align:1px} .pri.P0{background:var(--bad)} .pri.P1{background:var(--warn)}
.refnote{color:var(--ink)} table.rt{border-collapse:collapse;width:calc(100% - 20px);margin:0 10px 8px;font-size:12px} table.rt td,table.rt th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top} table.rt th{color:var(--muted);font-weight:600}
.road.vert{flex-direction:column;padding:4px 10px 10px;overflow:visible} .road.vert .step{margin:0 0 12px;min-width:0} .road.vert .step:not(:last-child)::after{right:auto;left:20px;top:auto;bottom:-13px;border:6px solid transparent;border-top:8px solid var(--line);transform:none}
details.box summary{cursor:pointer}
@media (max-width:1200px){ .app{grid-template-columns:130px minmax(0,1fr) 360px} }
@media (max-width:900px){ .app{grid-template-columns:110px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:auto} aside{grid-column:1/-1;overflow:visible} .tabbody{max-height:70vh} main{overflow:visible} .planbox{height:60vh;flex:none} .kpis{grid-template-columns:repeat(3,1fr)} }
</style>

<body>
<div class="app">
  <header>
    <a class="btn sm" href="index.html" title="작업 허브">⌂ 허브</a>
    <h1>상봉동 116-49 · 법규·인허가</h1>
    <span class="sub" id="srcInfo">불러오는 중…</span>
    <span class="sp"></span>
    <a class="btn sm" href="상봉동_116-49_조닝편집기.html" target="_blank">조닝 ↗</a>
    <a class="btn sm" href="상봉동_116-49_계획설계.html" target="_blank">계획설계 ↗</a>
    <span class="save" id="save"><i></i><span id="saveTxt">—</span></span>
    <button class="btn sm" id="themeBtn">◐</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"><div class="empty">데이터를 불러오는 중…</div></main>
  <aside id="side"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d=1)=>(+v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const ST={ok:['적합','s-ok'],bad:['부적합','s-bad'],chk:['확인 필요','s-chk'],proc:['해당 (절차)','s-proc'],na:['해당 없음','s-na']};
const PAGES={fire:'상봉동_116-49_소방피난.html',zoning:'상봉동_116-49_조닝편집기.html',plan:'상봉동_116-49_계획설계.html',site:'index.html',hub:'index.html'};
let Z=null,P=null,C=null,L=null,REF=null,checks=[],selId=null,catSel='all',stFilter=null;
const A=k=>+L.assumptions[k].v;
// ---------- 기하
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){ const q=p[i],r=p[(i+1)%p.length]; a+=q[0]*r[1]-r[0]*q[1]; } return Math.abs(a)/2; }
function rectPolyArea(z,poly){ const xs=[...new Set([z.x,z.x+z.w,...poly.map(p=>p[0]).filter(v=>v>z.x&&v<z.x+z.w)])].sort((a,b)=>a-b), ys=[...new Set([z.y,z.y+z.h,...poly.map(p=>p[1]).filter(v=>v>z.y&&v<z.y+z.h)])].sort((a,b)=>a-b); let a=0;
  for(let i=0;i<xs.length-1;i++) for(let j=0;j<ys.length-1;j++){ const cx=(xs[i]+xs[i+1])/2, cy=(ys[j]+ys[j+1])/2; let c=false; for(let k=0,m=poly.length-1;k<poly.length;m=k++){ const A_=poly[k],B=poly[m]; if((A_[1]>cy)!==(B[1]>cy)&&cx<(B[0]-A_[0])*(cy-A_[1])/(B[1]-A_[1])+A_[0]) c=!c; } if(c) a+=(xs[i+1]-xs[i])*(ys[j+1]-ys[j]); } return a; }
function segDist(p,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1], L2=dx*dx+dy*dy; let t=L2?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy)); }
function polyDist(P1,P2){ let m=Infinity; const ed=P=>P.map((p,i)=>[p,P[(i+1)%P.length]]); ed(P1).forEach(([a,b])=>P2.forEach(p=>m=Math.min(m,segDist(p,a,b)))); ed(P2).forEach(([a,b])=>P1.forEach(p=>m=Math.min(m,segDist(p,a,b)))); return m; }
// ---------- 지표 계산
function metrics(){ const M={}; const fl=Z.floors; const above=fl.filter(f=>f.level>0), below=fl.filter(f=>f.level<0);
  M.site=A('siteArea'); M.gfaAbove=0; M.farGfa=0; M.maxCov=0; M.parkAbove=0; M.openRamp=0;
  above.forEach(f=>{ const a=polyArea(f.outline); const up=fl.find(g=>g.level===f.level+1); const open=up?f.zones.filter(z=>z.type==='ramp').reduce((s,z)=>s+z.w*z.h-rectPolyArea(z,up.outline),0):0;
    const park=f.zones.filter(z=>['ramp','parking','aisle'].includes(z.type)).reduce((s,z)=>s+z.w*z.h,0); M.gfaAbove+=a; M.farGfa+=a-park; M.parkAbove+=park; M.openRamp+=open; M.maxCov=Math.max(M.maxCov,a-open); });
  M.gfaBelow=below.reduce((s,f)=>s+polyArea(f.outline),0); M.gfa=M.gfaAbove+M.gfaBelow;
  M.cov=M.maxCov/M.site*100; M.far=M.farGfa/M.site*100; M.height=above.reduce((s,f)=>s+f.height,0); M.floorsAbove=above.length; M.floorsBelow=below.length;
  M.depth=below.reduce((s,f)=>s+f.height,0);
  const zt=t=>fl.filter(f=>f.level>0).flatMap(f=>f.zones).filter(z=>z.type===t).reduce((s,z)=>s+z.w*z.h,0);
  M.retail=zt('retail'); M.pub=zt('public'); M.community=zt('community'); M.nonRes=(M.retail+M.pub)/M.gfaAbove*100;
  const units=P.floors.flatMap(f=>f.units.map(u=>({...u,floor:f.id,level:f.level}))); M.units=units.length; M.unitMin=Math.min(...units.map(u=>u.area)); M.unitMax=Math.max(...units.map(u=>u.area));
  M.unitMinU=units.find(u=>u.area===M.unitMin); M.unitMaxU=units.find(u=>u.area===M.unitMax); M.units6=units.filter(u=>u.level>=6).length;
  const stalls=P.floors.flatMap(f=>f.stalls||[]); M.stalls=stalls.length; M.ext=stalls.filter(s=>s.type.startsWith('확장형')).length; M.acc=stalls.filter(s=>s.type.startsWith('장애인')).length; M.ev=stalls.filter(s=>/전기차|EV/.test(s.type)).length;
  M.reqPark=Math.ceil(M.units*A('parkingPerUnit')+M.retail/A('retailM2PerStall'));
  const ramps=P.floors.flatMap(f=>(f.ramps||[]).map(r=>({...r,floor:f.id}))).filter(r=>r.slopePct!=null); M.rampMax=Math.max(...ramps.map(r=>r.slopePct)); M.rampEff=Math.min(...ramps.filter(r=>r.mode==='down').map(r=>r.width-(r.curb?2*r.curb.width:0))); M.headroom=Math.min(...ramps.filter(r=>r.headroom!=null).map(r=>r.headroom));
  const top=P.floors.filter(f=>f.level>0).reduce((a,f)=>f.level>a.level?f:a); M.topStairs=top.stairs.length; M.stairBad=P.floors.flatMap(f=>f.stairs).filter(s=>(s.checks||[]).some(c=>!c.ok)).length;
  M.emerg=top.elevators.filter(e=>e.emergency).length; M.lifts=top.elevators.length; M.maxFloorArea=Math.max(...above.map(f=>polyArea(f.outline)));
  M.daylightWarn=P.issues.filter(i=>i.kind==='daylight'&&i.level==='warn').length; M.planWarn=P.issues.filter(i=>i.level==='warn').length;
  M.openSpaceZones=fl.flatMap(f=>f.zones).filter(z=>/공개공지/.test(z.name)).reduce((s,z)=>s+z.w*z.h,0);
  M.landscape=fl.flatMap(f=>f.zones).filter(z=>/조경/.test(z.name)).reduce((s,z)=>s+z.w*z.h,0);
  const f1=fl.find(f=>f.level===1); M.minV=Math.min(...f1.outline.map(p=>p[1]));
  if(C&&!C.error){ const site=Z.site.uv; M.railDist=Math.min(...C.rail.map(r=>polyDist(site,r.pts))); const road=(C.roads.find(r=>r.front)||C.roads.find(r=>/대로/.test(r.name))); M.roadDist=road?polyDist(site,road.pts):null; }
  return M; }
// ---------- 항목
function build(M){ const pct=v=>fmt(v,1)+'%', m2=v=>fmt(v,1)+'㎡';
  const ck=(id,cat,title,law,value,req,status,how,src,note,ref,pri)=>({id,cat,title,law,value,req,status,how,src,note,ref,pri});
  const req=[]; const add=(...a)=>req.push(ck(...a));
  // 1. 밀도·형태
  add('cov','밀도·형태','건폐율','건축법 제55조 · 지구단위계획',pct(M.cov),`≤ ${A('coverageLimit')}%`,M.cov<=A('coverageLimit')+0.01?'ok':'bad',`최대 층 바닥면적 ${m2(M.maxCov)} ÷ 대지 ${m2(M.site)}${M.openRamp>0.05?` (지하주차장 경사로 ${m2(M.openRamp)} 제외)`:''}`,['zoning'],'');
  add('far','밀도·형태','용적률','건축법 제56조 · 지구단위계획 시행지침 (상한 960% 조건부)',pct(M.far),`≤ ${A('farLimit')}%`,M.far<=A('farLimit')+0.05?'ok':'bad',`지상 연면적 ${m2(M.gfaAbove)} − 지상 주차용 ${m2(M.parkAbove)} = ${m2(M.farGfa)}`,['zoning'],'완화·인센티브 조건 충족 여부는 별도 확인');
  add('height','밀도·형태','최고높이','가로구역별 최고높이 (망우로)',fmt(M.height,1)+'m',`≤ ${A('heightLimit')}m`,M.height<=A('heightLimit')?'ok':'bad',`지상 ${M.floorsAbove}개 층 층고 합 (옥탑 제외)`,['zoning'],'기준지반·옥탑 높이 산정 확인');
  { const RZ=/(전용|일반)주거/.test('일반상업지역'); add('sunlight','밀도·형태','정북 일조 사선','건축법 제61조','일반상업지역',RZ?'정북 인접대지경계에서 높이 10m 이하 1.5m · 초과분 높이의 1/2':'적용 제외',RZ?'chk':'na','전용·일반주거지역에만 적용',['site'],RZ?'매스 스터디 일조 사선으로 확인':'인접 주거지역 그림자 영향은 민원 대응용으로 별도 검토 권장'); }

function rect(g,s,r,c,lab,op){ el('rect',{x:r.x,y:-(r.y+r.h),width:r.w,height:r.h,fill:c,'fill-opacity':op??.3,stroke:c,'stroke-width':2*s},g); if(lab) label(g,s,r.x+r.w/2,r.y+r.h/2,lab); }
function hatch(g,s,r,c){ el('rect',{x:r.x,y:-(r.y+r.h),width:r.w,height:r.h,fill:'url(#hatch)',stroke:c,'stroke-width':1.5*s},g); }
function label(g,s,x,y,t,c){ el('text',{x,y:-y,'text-anchor':'middle','dominant-baseline':'middle','font-size':11*s,'font-weight':700,fill:c||'var(--ink)',stroke:'var(--panel)','stroke-width':3*s,'paint-order':'stroke','pointer-events':'none'},g).textContent=t; }
function rampOpen(g,s,zf){ const up=Z.floors.find(x=>x.level===zf.level+1); zf.zones.filter(z=>z.type==='ramp').forEach(z=>{ hatch(g,s,z,'#868e96'); label(g,s,z.x+z.w/2,z.y+z.h/2,'경사로 (제외)'); }); }
function frontBand(g,s){ const xs=Z.site.uv.map(p=>p[0]); const cp=el('clipPath',{id:'siteClip'},g); el('polygon',{points:pts(Z.site.uv)},cp); el('rect',{x:Math.min(...xs),y:0,width:Math.max(...xs)-Math.min(...xs),height:3,fill:'url(#hatch)',stroke:'none','clip-path':'url(#siteClip)'},g); label(g,s,(Math.min(...xs)+Math.max(...xs))/2+10,-1.5,'전면공지 3m'); }
function openGround(g,s,zf,c){ el('path',{d:'M'+Z.site.uv.map(p=>p[0]+','+(-p[1])).join('L')+'Z M'+zf.outline.map(p=>p[0]+','+(-p[1])).join('L')+'Z','fill-rule':'evenodd',fill:c,'fill-opacity':.3,stroke:c,'stroke-width':1.5*s},g); }
function unitsBy(g,s,f,val,lab){ const vs=f.units.map(val), lo=Math.min(...vs), hi=Math.max(...vs); f.units.forEach(u=>{ const t=hi>lo?(val(u)-lo)/(hi-lo):.5; const rs=u.rooms.map(id=>f.rooms.find(r=>r.id===id)).filter(Boolean); rs.forEach(r=>el('rect',{x:r.x,y:-(r.y+r.h),width:r.w,height:r.h,fill:HC.blue,'fill-opacity':.1+.45*t,stroke:'none'},g));
  const isMin=lastM&&u.area===lastM.unitMin, isMax=lastM&&u.area===lastM.unitMax; const big=rs.reduce((a,r)=>r.w*r.h>a.w*a.h?r:a,rs[0]); if(big) label(g,s,big.x+big.w/2,big.y+big.h/2,lab(u),isMin?HC.bad:isMax?HC.blue:null); }); }
function windows(g,s,f){ const wb=Object.fromEntries(f.walls.map(w=>[w.id,w])); f.openings.filter(o=>o.kind==='window').forEach(o=>{ const w=wb[o.wall]; if(!w) return; const L=w.len||1, ux=(w.b[0]-w.a[0])/L, uy=(w.b[1]-w.a[1])/L; const a=[w.a[0]+ux*(o.at-o.w/2),w.a[1]+uy*(o.at-o.w/2)], b=[w.a[0]+ux*(o.at+o.w/2),w.a[1]+uy*(o.at+o.w/2)]; el('line',{x1:a[0],y1:-a[1],x2:b[0],y2:-b[1],stroke:HC.blue,'stroke-width':Math.max(.35,4*s)},g); }); }
function stairs(g,s,f,dims){ f.rooms.filter(r=>r.corekind==='vestibule').forEach(r=>rect(g,s,r,'#69db7c',null,.35)); f.stairs.forEach(st=>{ rect(g,s,st,HC.grn,null,.35); for(let i=1;i<9;i++){ const y=st.y+st.h*i/9; el('line',{x1:st.x,y1:-y,x2:st.x+st.w,y2:-y,stroke:HC.grn,'stroke-width':s},g); }
  const bad=(st.checks||[]).some(c=>!c.ok); label(g,s,st.x+st.w/2,st.y+st.h+1.2,st.name.replace('특별피난계단','계단'),bad?HC.bad:HC.grn); if(dims) label(g,s,st.x-6.5,st.y+st.h/2,`단 ${(st.riser*100).toFixed(1)}/${(st.tread*100).toFixed(0)}cm · 폭 ${st.flightWidth}m`,bad?HC.bad:null); }); }
function egress(g,s,f){ const e=f.fire?.egress; if(!e?.worst?.path) return; const p=e.worst.path; el('polyline',{points:pts(p),fill:'none',stroke:'var(--panel)','stroke-width':7*s},g); el('polyline',{points:pts(p),fill:'none',stroke:HC.blue,'stroke-width':3.5*s,'stroke-dasharray':`${8*s} ${3*s}`},g); el('circle',{cx:p[0][0],cy:-p[0][1],r:5*s,fill:HC.blue},g); label(g,s,p[0][0],p[0][1]+1.6,`${e.worst.unit}${/^\d/.test(e.worst.unit)?'호':''} ${e.worst.dist.toFixed(1)}m / ${e.limit}m`,HC.blue); stairs(g,s,f); }
function stairSep(g,s,f){ stairs(g,s,f); const e=f.fire?.egress, sp=e?.stairSep; if(!sp||f.stairs.length<2) return; const c=f.stairs.map(st=>[st.x+st.w/2,st.y+st.h/2]); el('circle',{cx:c[0][0],cy:-c[0][1],r:sp.need,fill:HC.bad,'fill-opacity':.06,stroke:HC.bad,'stroke-width':1.5*s,'stroke-dasharray':`${6*s} ${4*s}`},g);
  el('line',{x1:c[0][0],y1:-c[0][1],x2:c[1][0],y2:-c[1][1],stroke:HC.bad,'stroke-width':3*s},g); label(g,s,c[0][0]-6,(c[0][1]+c[1][1])/2,`${sp.dist.toFixed(1)}m`,HC.bad); label(g,s,c[0][0],c[0][1]+sp.need+1.5,`필요 ${sp.need.toFixed(1)}m (대각선 ${sp.diag.toFixed(1)}m × 1/3)`,HC.bad); }
function lifts(g,s,f,em){ f.rooms.filter(r=>r.corekind==='vestibule'&&/비상/.test(r.name)).forEach(r=>rect(g,s,r,'#ffa94d',em?`승강장 ${(r.w*r.h).toFixed(1)}㎡`:null,.3)); f.elevators.forEach(e=>rect(g,s,e,e.emergency?HC.bad:HC.blue,em&&!e.emergency?null:e.name.replace('승강기','EV'),.4)); }
function stalls(g,s,f,only){ (f.stalls||[]).forEach(p=>{ const t=p.type, c=t.startsWith('확장형')?'#f59f00':t.startsWith('장애인')?HC.blue:/전기차|EV/.test(t)?HC.grn:'#adb5bd'; const on=!only||t.startsWith(only)||(only==='전기차'&&/EV/.test(t)); el('rect',{x:p.x+.05,y:-(p.y+p.h)+.05,width:p.w-.1,height:p.h-.1,fill:c,'fill-opacity':on?.7:.15,stroke:c,'stroke-opacity':on?1:.6,'stroke-width':(on?1.5:.8)*s},g); if(on&&only) label(g,s,p.x+p.w/2,p.y+p.h/2,p.no.split('-')[1],'#fff'); }); }
function ramps(g,s,f){ (f.ramps||[]).forEach(r=>{ rect(g,s,r,HC.hi,null,.25); if(r.curb){ const cw=r.curb.width; [[r.x,r.x+cw],[r.x+r.w-cw,r.x+r.w]].forEach(([a,b])=>el('rect',{x:a,y:-(r.y+r.h),width:b-a,height:r.h,fill:'#868e96'},g)); }
  label(g,s,r.x+r.w/2,r.y+r.h/2,r.slopePct!=null?`${r.slopePct}%`:'',HC.hi); if(r.slopePct!=null) label(g,s,r.x+r.w/2,r.y+r.h/2-1.8,`유효 ${(r.width-(r.curb?2*r.curb.width:0)).toFixed(1)}m${r.headroom!=null?` · 높이 ${r.headroom.toFixed(2)}m`:''}`); }); }
function railZone(g,s,lite){ if(!C||C.error) return; C.rail.forEach(r=>{ el('polygon',{points:pts(r.pts),fill:'#8b5e34','fill-opacity':lite?.15:.3,stroke:'#8b5e34','stroke-opacity':lite?.06:.1,'stroke-width':2*A('railZone'),'stroke-linejoin':'round'},g); });

  el('polygon',{points:pts(Z.site.uv),fill:'var(--panel)','fill-opacity':.6,stroke:'#c6402b','stroke-width':2*s,'stroke-dasharray':`${6*s} ${3*s}`},g);
  const xs=Z.site.uv.map(p=>p[0]); el('line',{x1:Math.min(...xs)-3,y1:0,x2:Math.max(...xs)+3,y2:0,stroke:HC.blue,'stroke-width':1.5*s,'stroke-dasharray':`${4*s} ${3*s}`},g);
