<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상봉동 116-49 조닝 편집기</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#fff; --ink:#1d2326; --muted:#5f6b70; --line:#d9d5cc; --chip:#eef1f3; --canvas:#fbfaf7;
  --accent:#1f4fd1; --bad:#d92d20; --warn:#b26a00; --ok:#1f7a4c; --site:#c6402b; --bline:#215cca; --grid:rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15191b; --panel:#1d2225; --ink:#e7ecee; --muted:#9aa6ab; --line:#333b3f; --chip:#262d31; --canvas:#181c1e;
  --accent:#7aa2ff; --bad:#ff6b5e; --warn:#f0b44c; --ok:#5fd39a; --site:#ff7a63; --bline:#7aa2ff; --grid:rgba(255,255,255,.06);}}
:root[data-theme="dark"]{
  --bg:#15191b; --panel:#1d2225; --ink:#e7ecee; --muted:#9aa6ab; --line:#333b3f; --chip:#262d31; --canvas:#181c1e;
  --accent:#7aa2ff; --bad:#ff6b5e; --warn:#f0b44c; --ok:#5fd39a; --site:#ff7a63; --bline:#7aa2ff; --grid:rgba(255,255,255,.06);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
.tabs{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;margin-left:8px}
.tabs button{border:none;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--panel);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sp{flex:1}
.save{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.save.ok i{background:var(--ok)} .save.pending i{background:var(--warn)} .save.err i{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
/* floors */
#floors{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 8px}
#floors h2,aside h2{font-size:12px;color:var(--muted);margin:14px 4px 6px;font-weight:700}
#floors h2:first-child,aside h2:first-child{margin-top:2px}
.fl{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:6px;padding:5px 7px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;font-variant-numeric:tabular-nums}
.fl:hover{background:var(--chip)}
.fl.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.fl b{font-size:13px}
.fl span{color:var(--muted);font-size:11px}
.fl .bd{font-size:11px;border-radius:6px;padding:0 5px;background:var(--chip);color:var(--muted)}
.fl .bd.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.fl.gl{border-top:1px dashed var(--line);border-radius:0;margin-top:4px;padding-top:8px}
/* center */
#center{position:relative;min-width:0;min-height:0;background:var(--canvas)}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
svg#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:default}
svg#plan.panning{cursor:grabbing}
svg#plan.drawing{cursor:crosshair}
.palette{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
.palette>*{pointer-events:auto}
.tool{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.tool i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.tool.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.tool.wall.on{border-color:var(--askc);box-shadow:0 0 0 2px color-mix(in srgb,var(--askc) 25%,transparent)}
.tool.sep{margin-left:6px}
.vtools{position:absolute;right:10px;bottom:34px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.vtools label{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;display:flex;gap:6px;align-items:center}
.vtools select{border:none;background:transparent}
.hint{position:absolute;left:10px;bottom:8px;right:200px;color:var(--muted);font-size:11.5px;pointer-events:none}
.coord{position:absolute;right:10px;bottom:8px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.north{position:absolute;right:16px;top:56px;width:46px;height:46px}
#v3d canvas{display:block}
.ov3d{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:5px}
.ov3d label{display:flex;gap:6px;align-items:center}
#sumPane{overflow:auto;padding:16px 18px}
table.sum{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.sum th,table.sum td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.sum th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--canvas)}
table.sum td:first-child,table.sum th:first-child{text-align:left}
table.sum tfoot td{font-weight:700;border-top:2px solid var(--line)}
table.sum tr.cur td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpis b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpis span{color:var(--muted);font-size:11.5px}
/* right */
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 14px 24px}
.prop{display:grid;grid-template-columns:72px 1fr;gap:5px 8px;align-items:center}
.prop label{color:var(--muted);font-size:12px}
.prop input,.prop select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.prop .two{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.empty{color:var(--muted);font-size:12.5px;padding:6px 2px}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.st{display:flex;gap:7px;align-items:flex-start;font-size:12px;margin:3px 0}
.st i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px;background:var(--ok)}
.st.bad i{background:var(--bad)} .st.warn i{background:var(--warn)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini div{background:var(--chip);border-radius:8px;padding:6px 8px}
.mini b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.mini span{color:var(--muted);font-size:11px}
.ifc{background:var(--chip);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--muted)}
.ifc code{font-size:11px;word-break:break-all;color:var(--ink)}
.rowsel{display:flex;gap:5px;align-items:center;margin-top:6px;font-size:12px}
.rowsel select{padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
:root{--ask1:#ff7a45;--ask2:#e8467c;--askc:#f0507a}
.askbtn{position:absolute;z-index:6;display:none;align-items:center;gap:9px;padding:11px 16px 11px 14px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--ask1),var(--ask2));color:#fff;font-size:15px;font-weight:800;letter-spacing:-.01em;cursor:pointer;box-shadow:0 10px 28px rgba(232,70,124,.38),0 2px 6px rgba(0,0,0,.2);transform:translateY(-100%);white-space:nowrap;animation:pop .16s ease-out}
.askbtn.on{display:inline-flex}
.askbtn.ghosted{pointer-events:none;opacity:.35}
.askbtn:hover{filter:brightness(1.07);box-shadow:0 12px 32px rgba(232,70,124,.48),0 2px 6px rgba(0,0,0,.2)}
.askbtn .spark{font-size:17px}
.askbtn .cnt{background:rgba(255,255,255,.24);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.askbtn kbd{background:rgba(255,255,255,.22);border-radius:5px;padding:0 6px;font:inherit;font-size:11px;font-weight:700}
@keyframes pop{from{opacity:0;transform:translateY(-90%) scale(.96)}to{opacity:1;transform:translateY(-100%) scale(1)}}
.askhdr{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:7px 14px;background:linear-gradient(135deg,var(--ask1),var(--ask2));color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 4px 14px rgba(232,70,124,.3)}
.askhdr b{background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;font-size:12px}
.askhdr.idle{opacity:.92}
.composer{position:absolute;z-index:7;width:390px;max-width:calc(100% - 20px);background:var(--panel);border:1.5px solid var(--askc);border-radius:14px;box-shadow:0 20px 54px rgba(0,0,0,.28);padding:12px 12px 10px;display:none}
.composer.on{display:block}
.composer h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.composer h4 .spark{color:var(--askc)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;max-height:86px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--askc) 11%,var(--chip));border:1px solid color-mix(in srgb,var(--askc) 35%,transparent);border-radius:999px;padding:2px 9px;font-size:11.5px;white-space:nowrap}
.chip.wall{border-style:dashed}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 2px;font-size:13px;line-height:1}
.composer textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font:inherit;color:var(--ink);outline:none}
.composer textarea:focus{border-color:var(--askc);box-shadow:0 0 0 3px color-mix(in srgb,var(--askc) 18%,transparent)}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.sugg button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.sugg button:hover{border-color:var(--askc);color:var(--ink)}
.composer .row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.sendbtn{background:linear-gradient(135deg,var(--ask1),var(--ask2));color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:13.5px}
.sendbtn.big{width:100%;padding:11px 14px;font-size:14.5px;border-radius:12px;margin-top:8px;box-shadow:0 6px 18px rgba(232,70,124,.28)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#cmtList{display:flex;flex-direction:column;gap:7px}
.cm{border:1px solid var(--line);border-left:4px solid var(--askc);border-radius:10px;padding:8px 9px;background:var(--panel);font-size:12.5px}
.cm.done{border-left-color:var(--ok);opacity:.75}
.cm.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--askc) 30%,transparent)}
.cmh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.cmn{background:var(--askc);color:#fff;border-radius:999px;padding:0 7px;font-weight:800;font-size:11.5px}
.cm.done .cmn{background:var(--ok)}
.cmt{color:var(--muted);font-size:11px}
.cms{margin-left:auto;font-size:11px;font-weight:700;color:var(--askc)}
.cm.done .cms{color:var(--ok)}
.cmx{white-space:pre-wrap;margin:3px 0 6px}
.cmr{background:var(--chip);border-radius:8px;padding:6px 8px;margin:4px 0;font-size:12px}
.cm .btns{margin-top:4px}
.cm .chips{margin-bottom:2px}
.cmhelp{color:var(--muted);font-size:11.5px;margin:2px 2px 8px}
.pin3d{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--askc);color:#fff;font-weight:800;font-size:11.5px;border-radius:999px 999px 999px 2px;padding:2px 8px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);white-space:nowrap}
.pin3d.done{background:var(--ok)}
#pins3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#pins3d .pin3d{pointer-events:auto}
.seg3{display:flex;background:var(--chip);border-radius:8px;padding:2px;gap:2px}
.seg3 button{flex:1;border:none;background:transparent;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
.seg3 button.on{background:var(--panel);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.wallinfo{display:grid;grid-template-columns:80px 1fr;gap:4px 8px;font-size:12.5px}
.wallinfo span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
/* svg */
.site{fill:none;stroke:var(--site);stroke-width:1.6;stroke-dasharray:8 4}
.bl{stroke:var(--bline);stroke-width:1.6;stroke-dasharray:10 4 2 4}
.outl{fill:var(--panel);stroke:var(--ink);stroke-width:2.4}
.ghost{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.zone{stroke-width:1.2;cursor:move}
.zone.bad{stroke:var(--bad)!important;stroke-width:2.4;stroke-dasharray:5 3}
.zone.sel{stroke:var(--accent)!important;stroke-width:2.6}
.zl{fill:var(--ink);pointer-events:none;font-weight:600}
.zs{fill:var(--muted);pointer-events:none}
.stall{fill:none;stroke:#3b4a52;stroke-opacity:.55;stroke-width:.8}
.hd{fill:var(--panel);stroke:var(--accent);stroke-width:1.6}
.eh{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:1.4;cursor:grab}
.gridl{stroke:var(--grid);stroke-width:1}
.rubber{fill:color-mix(in srgb,var(--accent) 15%,transparent);stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 3}
@media (max-width:1100px){ .app{grid-template-columns:150px minmax(0,1fr) 290px} .hint{display:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="hub-link" href="index.html" title="작업 허브 (전체 워크플로)" style="text-decoration:none;font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:7px;padding:2px 8px;margin-right:8px;color:inherit;opacity:.75;white-space:nowrap">⌂ 허브</a><h1>상봉동 116-49 · 조닝 편집기</h1>
    <div class="tabs" id="tabs"><button data-t="plan" class="on">평면</button><button data-t="3d">3D</button><button data-t="sum">집계</button></div>
    <span class="sp"></span>
    <button class="askhdr idle" id="askHdr" title="선택한 객체에 수정 요청 (C)">💬 수정 요청 <b id="askHdrN">0</b></button>
    <span class="save" id="save"><i></i><span id="saveTxt">—</span></span>
    <button class="btn sm" id="undoBtn" title="되돌리기 ⌘Z">↶</button>
    <button class="btn sm" id="redoBtn" title="다시하기 ⇧⌘Z">↷</button>
    <button class="btn sm" id="themeBtn" title="라이트/다크">◐</button>
  </header>

  <nav id="floors"></nav>

  <main id="center">
    <div class="pane on" id="planPane">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg"><g id="gGrid"></g><g id="gBase"></g><g id="gGhost"></g><g id="gZones"></g><g id="gTop"></g><g id="gPins"></g></svg>
      <div class="palette" id="palette"></div>
      <svg class="north" id="north" viewBox="-23 -23 46 46"></svg>
      <div class="vtools">
        <label>격자 <select id="snap"><option value="0.1">0.1m</option><option value="0.3" selected>0.3m</option><option value="0.6">0.6m</option><option value="1">1.0m</option></select></label>
        <label><input type="checkbox" id="ghostOn" checked>아래층 겹쳐보기</label>
        <label><input type="checkbox" id="stallOn" checked>주차구획 표시</label>
        <button class="btn sm" id="fitBtn">화면 맞춤 (F)</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="coord" id="coord"></div>
    </div>
    <div class="pane" id="v3d">
      <div class="ov3d">
        <div class="seg3" id="seg3"><button data-t="select">실 선택</button><button data-t="wall">벽 선택</button></div>
        <span style="color:var(--muted)">Shift+클릭 = 여러 개 · 더블클릭 = 평면으로</span>
        <label><input type="checkbox" id="cutOn">선택 층 위로 숨기기</label>
        <label><input type="checkbox" id="unitsOnly">주거유닛만 강조</label>
      </div>
      <div id="pins3d"></div>
    </div>
    <div class="pane" id="sumPane"></div>
    <button class="askbtn" id="askBtn"><span class="spark">✦</span>Claude에게 수정 요청<span class="cnt">1개</span><kbd>C</kbd></button>
    <div class="composer" id="composer">
      <h4><span class="spark">✦</span> Claude에게 수정 요청 <span style="margin-left:auto;color:var(--muted);font-weight:400;font-size:11.5px">Enter 보내기 · Shift+Enter 줄바꿈</span></h4>
      <div class="chips" id="cmpChips"></div>
      <textarea id="cmpText" placeholder="무엇을 바꿀까요?&#10;예) 이 벽을 1m 북쪽으로 옮겨줘 / 두 세대를 투룸 하나로 합쳐줘 / 램프 폭을 3.3m로"></textarea>
      <div class="sugg" id="cmpSugg"></div>
      <div class="row2"><span style="color:var(--muted);font-size:11.5px" id="cmpNote"></span><span style="display:flex;gap:6px"><button class="btn sm" id="cmpCancel">취소</button><button class="sendbtn" id="cmpSend">요청 남기기 ↵</button></span></div>
    </div>
  </main>

  <aside>
    <h2 style="display:flex;align-items:center;gap:6px">💬 수정 요청 <span id="cmtCount" style="font-weight:400"></span><button class="btn sm" id="cmtFilter" style="margin-left:auto">열린 것만</button></h2>
    <div class="cmhelp">객체를 선택하고 <b style="color:var(--askc)">✦ Claude에게 수정 요청</b>을 누르세요. 요청은 조닝 JSON에 저장되고, 대화창에서 “요청 반영해줘”라고 하면 Claude가 읽고 고칩니다.</div>
    <div id="cmtList"></div>
    <h2 id="selTitle">선택한 구역</h2>
    <div id="zoneProps"></div>
    <h2>현재 층</h2>
    <div id="floorProps"></div>
    <h2>검토</h2>
    <div id="checks"></div>
    <h2>IFC 연동</h2>
    <div class="ifc" id="ifcBox"></div>
    <div class="btns">
      <button class="btn sm" id="expBtn">JSON 내보내기</button>
      <label class="btn sm" style="display:inline-flex;align-items:center">JSON 불러오기<input type="file" id="impFile" accept=".json,application/json" hidden></label>
      <button class="btn sm danger" id="resetBtn">기본 초안으로 초기화</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

/* ---------- geometry ---------- */
const polyArea=p=>{let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;};
function pip(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function onB(p,poly,t=0.02){for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let k=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;k=Math.max(0,Math.min(1,k));if(Math.hypot(p[0]-a[0]-k*dx,p[1]-a[1]-k*dy)<t)return true;}return false;}
const inPoly=(p,poly)=>pip(p,poly)||onB(p,poly);
function rectInPoly(z,poly){ const c=[[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.h],[z.x,z.y+z.h]];
  if(!c.every(p=>inPoly(p,poly))) return false;
  return !poly.some(p=>p[0]>z.x+0.01&&p[0]<z.x+z.w-0.01&&p[1]>z.y+0.01&&p[1]<z.y+z.h-0.01); }
const ov=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
const zA=z=>z.w*z.h;
const EPS=0.02;
function facadeSegs(z,poly){ const segs=[]; const E=[[z.x,z.y,z.x+z.w,z.y],[z.x,z.y+z.h,z.x+z.w,z.y+z.h],[z.x,z.y,z.x,z.y+z.h],[z.x+z.w,z.y,z.x+z.w,z.y+z.h]];
  for(let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length];
    E.forEach(([x0,y0,x1,y1])=>{
      if(Math.abs(y0-y1)<1e-9 && Math.abs(a[1]-b[1])<EPS && Math.abs(a[1]-y0)<EPS){ const lo=Math.max(x0,Math.min(a[0],b[0])), hi=Math.min(x1,Math.max(a[0],b[0])); if(hi-lo>0.01) segs.push([lo,y0,hi,y0]); }
      if(Math.abs(x0-x1)<1e-9 && Math.abs(a[0]-b[0])<EPS && Math.abs(a[0]-x0)<EPS){ const lo=Math.max(y0,Math.min(a[1],b[1])), hi=Math.min(y1,Math.max(a[1],b[1])); if(hi-lo>0.01) segs.push([x0,lo,x0,hi]); }
    }); }
  return segs; }
const segLen=s=>Math.hypot(s[2]-s[0],s[3]-s[1]);
function contactLen(a,b){ let L=0;
  if(Math.abs(a.x+a.w-b.x)<EPS||Math.abs(b.x+b.w-a.x)<EPS) L=Math.max(L,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  if(Math.abs(a.y+a.h-b.y)<EPS||Math.abs(b.y+b.h-a.y)<EPS) L=Math.max(L,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
  return Math.max(0,L); }
const ACCESS_TYPES=['corridor','lobby','aisle'];
function stalls(z,P=doc.params.stall){
  if(z.parkingMode==='row'){ // 1열·직각 주차: 주차칸 깊이가 열의 짧은 변(차로 쪽)에 오도록. 확장형 2.6×5.2, 장애인 3.3×5.0
    const dir=z.parkingDir==='u'?'u':z.parkingDir==='v'?'v':(z.h<=z.w?'u':'v'); const L=dir==='u'?z.w:z.h, D=dir==='u'?z.h:z.w;
    const ext=z.stallType==='확장형', SW=ext?2.6:P.w, SD=ext?5.2:P.d, nB=Math.floor(D/SD+1e-6), acc=nB?Math.max(0,Math.min(Math.floor(+z.accessible||0),Math.floor(L/3.3+1e-6))):0;
    const first=acc+Math.floor((L-acc*3.3)/SW+1e-6), n=nB?first+(nB-1)*Math.floor(L/SW+1e-6):0; return {n, dir, row:true, SW, SD, nB, acc, ext}; }
  const rows=L=>{const m=2*P.d+P.aisle;let n2=Math.floor(L/m),rem=L-n2*m;return 2*n2+(rem>=P.d+P.aisle-1e-6?1:0);};
  const cu=rows(z.h)*Math.floor(z.w/P.w+1e-6), cv=rows(z.w)*Math.floor(z.h/P.w+1e-6);
  const dir=z.parkingDir==='u'?'u':z.parkingDir==='v'?'v':(cu>=cv?'u':'v');
  return {n:dir==='u'?cu:cv, dir};
}
function rectPolyArea(z,poly){ // 사각형 z 중 직교 다각형 poly 안에 드는 면적
  const xs=[...new Set([z.x,z.x+z.w,...poly.map(p=>p[0]).filter(v=>v>z.x&&v<z.x+z.w)])].sort((a,b)=>a-b), ys=[...new Set([z.y,z.y+z.h,...poly.map(p=>p[1]).filter(v=>v>z.y&&v<z.y+z.h)])].sort((a,b)=>a-b); let a=0;
  for(let i=0;i<xs.length-1;i++) for(let j=0;j<ys.length-1;j++){ const cx=(xs[i]+xs[i+1])/2, cy=(ys[j]+ys[j+1])/2; let c=false; for(let k=0,m=poly.length-1;k<poly.length;m=k++){ const A=poly[k],B=poly[m]; if((A[1]>cy)!==(B[1]>cy)&&cx<(B[0]-A[0])*(cy-A[1])/(B[1]-A[1])+A[0]) c=!c; } if(c) a+=(xs[i+1]-xs[i])*(ys[j+1]-ys[j]); }
  return a; }
function floorStats(f){
  const s={area:polyArea(f.outline),zoned:0,units:0,unitArea:0,byType:{},byUnit:{},stalls:0,bad:0,warn:0};
  f.zones.forEach(z=>{ const a=zA(z); s.zoned+=a; s.byType[z.type]=(s.byType[z.type]||0)+a;
    if(z.type==='unit'){ s.units++; s.unitArea+=a; s.byUnit[z.unitType||'기타']=(s.byUnit[z.unitType||'기타']||0)+1; }
    if(z.type==='parking') s.stalls+=stalls(z).n; });
  const iss=zoneIssues(f); s.bad=Object.values(iss).filter(v=>v.bad).length; s.warn=Object.values(iss).filter(v=>!v.bad).length;
  return s;
}
function zoneIssues(f){
  const out={};
  f.zones.forEach((z,i)=>{ const msgs=[]; let bad=false;
    if(!rectInPoly(z,f.outline)){ msgs.push('외곽선 밖으로 나감'); bad=true; }
    f.zones.forEach((o,j)=>{ if(j!==i && ov(z,o)>0.05){ msgs.push(`'${o.name}'와 겹침`); bad=true; } });
    if(z.type==='unit'){ const ut=UNIT_TYPES[z.unitType]||UNIT_TYPES['원룸']; const a=zA(z);
      if(a<20) {msgs.push('전용 20㎡ 미만 (지침 하한)'); } else if(a>60) msgs.push('전용 60㎡ 초과 (지침 상한 근처)');
      else if(a<ut.min||a>ut.max) msgs.push(`${z.unitType} 기준(${ut.min}~${ut.max}㎡) 밖`);
      if(Math.min(z.w,z.h)<2.7) msgs.push('폭 2.7m 미만');
      const win=facadeSegs(z,f.outline).reduce((s,g)=>s+segLen(g),0), wmin=+(doc.params.windowMin||2.4);
      if(win<0.01){ msgs.push('창 없음 — 외벽에 닿지 않음'); bad=true; } else if(win<wmin) msgs.push(`외벽 면 ${win.toFixed(2)}m (창 기준 ${wmin}m 미만)`);
      const acc=Math.max(0,...f.zones.filter(o=>ACCESS_TYPES.includes(o.type)).map(o=>contactLen(z,o)));
      if(acc<0.9){ msgs.push('복도·로비와 닿지 않음 — 출입 불가'); bad=true; } }
    if(z.type==='core' && f.level>=3){ const acc=Math.max(0,...f.zones.filter(o=>ACCESS_TYPES.includes(o.type)).map(o=>contactLen(z,o))); if(acc<0.9) msgs.push('코어가 복도·EV홀과 닿지 않음'); }
    if(z.type==='ramp' && Math.min(z.w,z.h)<3.3) msgs.push('램프 폭 3.3m 미만');
    if(z.type==='ramp' && (+z.landing||0)>=0 && f.level!==Math.min(...doc.floors.map(g=>g.level))){ const ri=rampInfo(z,f); if(ri.slope!=null && ri.slope>17.05) msgs.push(`램프 경사 약 ${ri.slope.toFixed(1)}% (직선 17% 초과)`); }
    if(z.type==='corridor' && f.level>0 && Math.min(z.w,z.h)<1.2) msgs.push('복도 폭 1.2m 미만');
    if(msgs.length) out[z.id]={msgs,bad};
  });
  return out;
}

/* ---------- plan view ---------- */
const svg=$('plan');
let vb={x:0,y:0,w:100,h:100};
const box=()=>{const r=$('center').getBoundingClientRect();return{w:Math.max(r.width,50),h:Math.max(r.height,50)};};
const px=()=>vb.w/box().w;
const Y=v=>-v;
function fit(){ let pts=[...((doc.site&&doc.site.uv)||[]),...(F().outline||[])]; if(!pts.length) pts=[[-15,-3],[40,50]]; /* 실습: 대지 경계가 아직 없을 때 */ const us=pts.map(p=>p[0]), vs=pts.map(p=>p[1]); const pad=6;
  const x0=Math.min(...us)-pad,x1=Math.max(...us)+pad,y0=-Math.max(...vs)-pad-6,y1=-Math.min(...vs)+pad; const B=box(), r=B.w/B.h; let w=x1-x0,h=y1-y0;
  if(w/h<r){const nw=h*r;vb={x:x0-(nw-w)/2,y:y0,w:nw,h};}else{const nh=w/r;vb={x:x0,y:y0-(nh-h)/2,w,h:nh};} applyVB(); }
function applyVB(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); drawPlan(); }
function toM(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return[q.x,-q.y];}
function el(tag,a,parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;}
const ptsA=p=>p.map(q=>q[0]+','+(-q[1])).join(' ');
const snap=v=>{const s=+$('snap').value;return Math.round(v/s)*s;};
const r3=v=>Math.round(v*1000)/1000;

function emptyHint(){ let h=document.getElementById('emptyHint'); const none=!(doc.site&&doc.site.uv&&doc.site.uv.length);
  if(!h){ h=document.createElement('div'); h.id='emptyHint'; h.style.cssText='position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);max-width:460px;padding:22px 26px;border-radius:14px;background:var(--panel,#1b2028);border:1px dashed var(--accent,#ff6b8b);color:var(--text,#e8ecf1);font-size:14px;line-height:1.6;text-align:center;z-index:5;pointer-events:none';
    h.innerHTML='<b style="font-size:16px">대지 경계가 아직 없습니다</b><br>대화창에서 Claude에게<br><b>“대지 경계 표시해줘”</b><br>라고 요청한 뒤 이 페이지를 새로고침하세요.'; (svg.parentElement||document.body).appendChild(h); }
  h.style.display=none?'block':'none'; }
function drawPlan(){ try{ emptyHint(); }catch(e){}
  const s=px(), f=F();
  // grid
  const gg=$('gGrid'); gg.innerHTML='';
  const step = s<0.05?1: s<0.12?3 : 6;
  for(let u=Math.floor(vb.x/step)*step;u<vb.x+vb.w;u+=step) el('line',{x1:u,x2:u,y1:vb.y,y2:vb.y+vb.h,class:'gridl','vector-effect':'non-scaling-stroke'},gg);
  for(let y=Math.floor(vb.y/step)*step;y<vb.y+vb.h;y+=step) el('line',{x1:vb.x,x2:vb.x+vb.w,y1:y,y2:y,class:'gridl','vector-effect':'non-scaling-stroke'},gg);
  // base
  const gb=$('gBase'); gb.innerHTML='';
  el('polygon',{points:ptsA(doc.site.uv),class:'site','vector-effect':'non-scaling-stroke'},gb);
  if(f.level>0){ const bl=doc.context.bline; el('line',{x1:-30,x2:60,y1:0,y2:0,class:'bl','vector-effect':'non-scaling-stroke'},gb);
    const t=el('text',{x:vb.x+8*s,y:12*s,'font-size':10*s,fill:css('--bline')},gb); t.textContent='건축한계선 3m (망우로 쪽)'; }
  const tt=el('text',{x:vb.x+8*s,y:-(doc.site.uv.reduce((m,p)=>Math.min(m,p[1]),1e9))+26*s,'font-size':11*s,fill:css('--muted')},gb); tt.textContent='↓ 망우로';
  el('polygon',{points:ptsA(f.outline),class:'outl','vector-effect':'non-scaling-stroke'},gb);
  // ghost (floor below)
  const gh=$('gGhost'); gh.innerHTML='';
  if($('ghostOn').checked && cur>0){ const b=doc.floors[cur-1]; el('polygon',{points:ptsA(b.outline),class:'ghost','vector-effect':'non-scaling-stroke'},gh);
    b.zones.forEach(z=>{ if(z.type==='core'||z.type==='ramp'||z.type==='unit'||z.type==='corridor') el('rect',{x:z.x,y:-(z.y+z.h),width:z.w,height:z.h,class:'ghost','vector-effect':'non-scaling-stroke'},gh); }); }
  // zones
  const gz=$('gZones'); gz.innerHTML='';
  const iss=zoneIssues(f);
  f.zones.forEach(z=>{
    const g=el('g',{},gz);
    const r=el('rect',{x:z.x,y:-(z.y+z.h),width:z.w,height:z.h,fill:typeColor(z.type),'fill-opacity':z.type==='corridor'?0.9:0.82,stroke:'rgba(0,0,0,.35)',class:'zone'+(iss[z.id]&&iss[z.id].bad?' bad':'')+(isSelZone(z.id)?' sel':''),'vector-effect':'non-scaling-stroke','data-id':z.id},g);
    if(z.type==='parking' && $('stallOn').checked) drawStalls(z,g);
    if(z.type==='ramp') drawRamp(z,g);
    if(z.type==='unit') facadeSegs(z,f.outline).forEach(s2=>el('line',{x1:s2[0],y1:-s2[1],x2:s2[2],y2:-s2[3],stroke:'#2b7bd6','stroke-width':4.5,'stroke-linecap':'butt','vector-effect':'non-scaling-stroke'},g));
    const minPx=Math.min(z.w,z.h)/s;
    if(minPx>26){ const fs=Math.min(12, Math.max(8, Math.min(z.w,z.h)/s/4.5))*s;
      const cx=z.x+z.w/2, cy=-(z.y+z.h/2);
      const name = z.type==='unit' ? `${z.name}` : z.name;
      const sub = z.type==='unit' ? `${z.unitType||''} ${fmt(zA(z),1)}㎡` : z.type==='parking' ? `${stalls(z).n}대 · ${fmt(zA(z),0)}㎡` : `${fmt(zA(z),1)}㎡`;
      const vert = z.h > z.w*1.6 && z.w/s < 90;
      const t1=el('text',{x:cx,y:cy-fs*0.15,'font-size':fs,class:'zl','text-anchor':'middle',transform:vert?`rotate(-90 ${cx} ${cy})`:''},g); t1.textContent=name;
      const t2=el('text',{x:cx,y:cy+fs*1.05,'font-size':fs*0.85,class:'zs','text-anchor':'middle',transform:vert?`rotate(-90 ${cx} ${cy})`:''},g); t2.textContent=sub;
    }
    r.addEventListener('pointerdown',e=>onZoneDown(e,z));

function refOutline(sign){ const d=DEFAULT.floors.find(f=>sign>0? f.level===3 : f.level===-1); return d.outline; }
function floorOpts(selIdx,excludeSelf){ return doc.floors.map((f,i)=>({f,i})).sort((a,b)=>b.f.level-a.f.level).filter(({i})=>!excludeSelf||i!==selIdx).map(({f,i})=>`<option value="${i}" ${i===selIdx?'selected':''}>${f.id}</option>`).join(''); }
function rangeIdx(a,b){ const la=doc.floors[a].level, lb=doc.floors[b].level, lo=Math.min(la,lb), hi=Math.max(la,lb); return doc.floors.map((f,i)=>({f,i})).filter(({f})=>f.level>=lo&&f.level<=hi).map(({i})=>i); }
function copyZoneToRange(z,a,b){ commit(); let n=0; rangeIdx(a,b).forEach(i=>{ if(i===cur) return; const f=doc.floors[i];
    f.zones=f.zones.filter(o=>!(Math.abs(o.x-z.x)<0.01&&Math.abs(o.y-z.y)<0.01&&Math.abs(o.w-z.w)<0.01&&Math.abs(o.h-z.h)<0.01));
    const c={...clone(z),id:newId()}; if(z.type==='unit'&&f.level>0) c.name=`${f.level}${String(z.name).slice(-2)}`; f.zones.push(c); n++; });
  changed(); toast(`${n}개 층에 같은 위치로 복사`); }
function copyFloorToRange(a,b){ const src=F(); const idx=rangeIdx(a,b).filter(i=>i!==cur); if(!idx.length) return;
  if(!confirm(`${src.id}의 외곽선·조닝으로 ${idx.map(i=>doc.floors[i].id).join(', ')} 층을 덮어씁니다. 계속할까요? (되돌리기 가능)`)) return;
  commit(); idx.forEach(i=>{ const f=doc.floors[i]; f.outline=clone(src.outline); f.zones=src.zones.map(z=>{ const c={...clone(z),id:newId()}; if(z.type==='unit'&&f.level>0) c.name=`${f.level}${String(z.name).slice(-2)}`; return c; }); });
  changed(); toast(`${idx.length}개 층 덮어쓰기 완료`); }

/* ---------- building totals & checks ---------- */
function totals(){
  const P=doc.params, site=doc.project.siteAreaOfficial; const T={gfa:0,farGfa:0,parkAbove:0,openRamp:0,units:0,unitArea:0,byUnit:{},stalls:0,retail:0,pub:0,maxCov:0,H:0,floorsAbove:0,floorsBelow:0,byType:{}};
  doc.floors.forEach((f,i)=>{ const s=floorStats(f); if(f.level>0){ const up=doc.floors.find(g=>g.level===f.level+1);
      // 건축면적: 위층이 덮지 않는 지하주차장 경사로는 제외 (건축법 시행령 제119조①2다8)
      const open=up? f.zones.filter(z=>z.type==='ramp').reduce((a,z)=>a+zA(z)-rectPolyArea(z,up.outline),0) : 0;
      // 용적률 연면적: 지상층 주차용(램프·주차·차로) 면적 제외 (같은 조 ①4나)
      const park=f.zones.filter(z=>['ramp','parking','aisle'].includes(z.type)).reduce((a,z)=>a+zA(z),0);
      T.gfa+=s.area; T.farGfa+=s.area-park; T.parkAbove+=park; T.openRamp+=open; T.maxCov=Math.max(T.maxCov,s.area-open); T.H+=f.height; T.floorsAbove++; } else T.floorsBelow++;
    T.units+=s.units; T.unitArea+=s.unitArea; for(const k in s.byUnit) T.byUnit[k]=(T.byUnit[k]||0)+s.byUnit[k]; T.stalls+=s.stalls;
    if(f.level>0){ T.retail+=(s.byType.retail||0); T.pub+=(s.byType.public||0); } for(const k in s.byType) T.byType[k]=(T.byType[k]||0)+s.byType[k]; });
  T.far=T.farGfa/site*100; T.cov=T.maxCov/site*100; T.nonRes=(T.retail+T.pub)/T.gfa*100;
  T.reqPark=Math.ceil(T.units*P.parkingPerUnit + T.retail/P.retailM2PerStall);
  return T;
}
function stackCheck(type){ // same-position check across floors for cores/ramps
  const sig=f=>f.zones.filter(z=>z.type===type).map(z=>[z.x,z.y,z.w,z.h].map(v=>v.toFixed(2)).join(',')).sort().join('|');
  const fl=doc.floors.filter(f=>f.zones.some(z=>z.type===type)); if(!fl.length) return null;
  const ref=(fl.find(f=>f.level===1)||fl[0]).zones.filter(z=>z.type===type);
  if(type==='ramp') return fl.filter(f=>{ if(f.level===1) return false; const upLv=f.level===-1?1:f.level+1; const up=doc.floors.find(g=>g.level===upLv);
      const ur=up? up.zones.filter(z=>z.type==='ramp') : []; if(!ur.length) return true;
      return !f.zones.filter(z=>z.type==='ramp').every(z=>ur.some(r=>ov(z,r)>=0.5*Math.min(zA(z),zA(r)))); }).map(f=>f.id);
  const key=z=>[z.x,z.y,z.w,z.h].map(v=>(+v).toFixed(2)).join(',');
  return fl.filter(f=>{ if(f.level===1) return false; const adjLv = f.level>1? f.level-1 : (f.level===-1? 1 : f.level+1); const adj=doc.floors.find(g=>g.level===adjLv); if(!adj) return true;
    const ak=new Set(adj.zones.filter(z=>z.type===type).map(key)); return !f.zones.filter(z=>z.type===type).every(z=>ak.has(key(z))); }).map(f=>f.id);
}
function renderChecks(){
  const T=totals(), P=doc.params, items=[], f=F(), iss=zoneIssues(f);
  const nb=Object.values(iss).filter(v=>v.bad).length, nw=Object.values(iss).filter(v=>!v.bad).length;
  items.push(nb?['bad',`이 층: 겹침·외곽선 이탈 ${nb}건`]:['ok','이 층: 겹침·외곽선 이탈 없음']);
  if(nw) items.push(['warn',`이 층: 크기 기준 확인 ${nw}건 (유닛·램프·복도)`]);
  items.push(T.cov<=P.coverageLimit+0.01?['ok',`건폐율 ${fmt(T.cov,2)}% (최대 층 기준, 한도 ${P.coverageLimit}%${T.openRamp>0.05?` · 지하주차장 경사로 ${fmt(T.openRamp,1)}㎡ 제외`:''})`]:['bad',`건폐율 ${fmt(T.cov,2)}% 초과`]);
  items.push(T.far<=P.farTarget+0.05?['ok',`용적률 ${fmt(T.far,1)}% (목표 ${P.farTarget}%${T.parkAbove>0.05?` · 지상 주차용 ${fmt(T.parkAbove,0)}㎡ 제외`:''})`]:['bad',`용적률 ${fmt(T.far,1)}% — 목표 ${P.farTarget}% 초과`]);
  items.push(T.H<=P.maxHeight?['ok',`지상 높이 ${fmt(T.H,1)}m (한도 ${P.maxHeight}m, 옥탑 제외)`]:['bad',`높이 ${fmt(T.H,1)}m 초과`]);
  items.push(T.stalls>=T.reqPark?['ok',`주차 ${T.stalls}대 / 필요 ${T.reqPark}대 (가정)`]:['warn',`주차 ${T.stalls}대 / 필요 ${T.reqPark}대 (가정) — ${T.reqPark-T.stalls}대 부족`]);
  items.push((T.nonRes>=10&&T.nonRes<=20)?['ok',`비주거(근생+공공) ${fmt(T.nonRes,1)}%`]:['warn',`비주거(근생+공공) ${fmt(T.nonRes,1)}% — 10~20% 기준 확인`]);
  const cs=stackCheck('core'); if(cs) items.push(cs.length?['warn',`코어가 아래(지하는 위)층과 이어지지 않는 층: ${cs.join(', ')}`]:['ok','코어가 1층까지 끊김 없이 이어짐']);
  const rs=stackCheck('ramp'); if(rs) items.push(rs.length?['warn',`램프 위치가 다른 층: ${rs.join(', ')}`]:['ok','램프가 층마다 같은 위치']);
  const above=doc.floors.filter(g=>g.level>0); if(above.some(g=>g.outline.some(p=>p[1]<-0.01))) items.push(['bad','지상층 외곽선이 건축한계선(v=0)을 넘음']);
  $('checks').innerHTML=items.map(([k,t])=>`<div class="st ${k==='ok'?'':k}"><i></i><span>${t}</span></div>`).join('');
  $('ifcBox').innerHTML = `이 화면의 조닝이 ${HTTP?'자동 저장되는':'저장될'} JSON 파일을 기준으로 Claude가 IFC4 모델을 만듭니다.<br>
   ${HTTP?'<b>저장 위치</b> <code>zoning/상봉동_116-49_zoning.json</code>':'<b>지금은 파일로 열려 있어 자동 저장이 안 됩니다.</b> 로컬 서버 주소로 열거나 JSON을 내보내 주세요.'}<br>
   층 → IfcBuildingStorey, 외곽선 → IfcSlab·외벽, 구역 → IfcSpace(용도·이름·면적), 좌표 → EPSG:5186.`;
}

  [['pPU','parkingPerUnit'],['pRM','retailM2PerStall'],['pFar','farTarget'],['pMaxH','maxHeight']].forEach(([id,k])=>$(id).onchange=()=>{ const v=parseFloat($(id).value); if(!isFinite(v)) return; commit(); doc.params[k]=v; changed(); });
}

/* ---------- 3D ---------- */
let R=null, tab='plan';
function init3D(){
  if(R||!window.THREE) return; const host=$('v3d');
  const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(2,devicePixelRatio)); host.insertBefore(renderer.domElement,host.firstChild);
  const scene=new THREE.Scene(); scene.background=new THREE.Color(css('--canvas')||'#fbfaf7');
  const cam=new THREE.PerspectiveCamera(35,1,0.5,3000); const ctl=new THREE.OrbitControls(cam,renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x9aa09a,0.75)); const dl=new THREE.DirectionalLight(0xffffff,0.55); dl.position.set(-60,120,90); scene.add(dl);
  const grp=new THREE.Group(); scene.add(grp);
  R={renderer,scene,cam,ctl,grp,pick:[],pins:[]};
  cam.position.set(-70,80,110); ctl.target.set(12,20,-20);
  const ray=new THREE.Raycaster(); let down=null;
  renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  renderer.domElement.addEventListener('pointerup',e=>{ if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4) return; down=null; const r=renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam); const hit=ray.intersectObjects(R.pick,false)[0];
    const add=e.shiftKey||e.metaKey||e.ctrlKey;
    if(hit && hit.object.userData.zid){ const ud=hit.object.userData, f=doc.floors[ud.fi]; let t={k:'zone',fid:f.id,id:ud.zid};
      if(tool==='wall'||e.altKey){ const n=hit.face.normal; const side= Math.abs(n.y)>0.5? null : Math.abs(n.x)>Math.abs(n.z)? (n.x>0?'E':'W') : (n.z<0?'N':'S');
        if(side) t={k:'wall',fid:f.id,id:ud.zid,side}; else { const z=f.zones.find(q=>q.id===ud.zid); const p=hit.point; t={k:'wall',fid:f.id,id:ud.zid,side:nearestSide(z,[p.x,-p.z])[0]}; } }
      cur=ud.fi; add? toggleSel(t) : setSel([t]); renderAll(); }
    else if(hit){ cur=hit.object.userData.fi; if(!add) setSel([]); renderAll(); }
    else { if(!add){ setSel([]); renderAll(); } } });
  renderer.domElement.addEventListener('dblclick',()=>{ setTab('plan'); });
  (function loop(){ requestAnimationFrame(loop); if(tab!=='3d') return; ctl.update(); renderer.render(scene,cam); positionPins3D(); if(sel.length) updateAsk(); })();
}
function anchor3D(i){ if(!i||!window.THREE) return null; const slab=0.25; return new THREE.Vector3(i.anchor[0], i.floorElev+slab+(i.kind==='wall'? i.floorHeight*0.55 : i.floorHeight-0.05), -i.anchor[1]); }
function rebuild3D(){
  if(!R) return; const {grp}=R; while(grp.children.length){ const c=grp.children.pop(); c.geometry&&c.geometry.dispose(); } R.pick=[];
  const cutOn=$('cutOn').checked, unitsOnly=$('unitsOnly').checked, curLv=F().level; const AC=new THREE.Color(css('--askc')||'#f0507a');
  const shape=pts=>{ const s=new THREE.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); return s; };
  const ext=(pts,h,base,mat)=>{ const g=new THREE.ExtrudeGeometry(shape(pts),{depth:h,bevelEnabled:false}); g.rotateX(-Math.PI/2); g.translate(0,base,0); return new THREE.Mesh(g,mat); };
  const site=new THREE.Line(new THREE.BufferGeometry().setFromPoints([...doc.site.uv,doc.site.uv[0]].map(p=>new THREE.Vector3(p[0],0.02,-p[1]))),new THREE.LineBasicMaterial({color:0xc6402b})); grp.add(site);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0xdde0db,transparent:true,opacity:0.55,side:THREE.DoubleSide})); gnd.rotation.x=-Math.PI/2; gnd.position.set(10,-0.01,-20); grp.add(gnd);
  const slabMat=new THREE.MeshLambertMaterial({color:0xbfc4c6}); const edge=new THREE.LineBasicMaterial({color:0x334046,transparent:true,opacity:0.5});
  const selEdge=new THREE.LineBasicMaterial({color:AC});
  const mats={}; const mat=t=>mats[t]||(mats[t]=new THREE.MeshLambertMaterial({color:new THREE.Color(typeColor(t)),transparent:unitsOnly&&t!=='unit',opacity:unitsOnly&&t!=='unit'?0.18:1}));
  const wallMat=new THREE.MeshBasicMaterial({color:AC,transparent:true,opacity:0.9});
  doc.floors.forEach((f,fi)=>{ if(cutOn && f.level>curLv) return;
    const base=elevOf(fi), slab=0.25;
    const sm=ext(f.outline,slab,base,slabMat); sm.userData={fi}; grp.add(sm); R.pick.push(sm);
    f.zones.forEach(z=>{ const h=Math.max(0.2,f.height-slab-0.05); const e4=0.04, pts=[[z.x+e4,z.y+e4],[z.x+z.w-e4,z.y+e4],[z.x+z.w-e4,z.y+z.h-e4],[z.x+e4,z.y+z.h-e4]];
      const isSel=sel.some(s=>s.k==='zone'&&s.fid===f.id&&s.id===z.id);
      const mm= isSel? new THREE.MeshLambertMaterial({color:new THREE.Color(typeColor(z.type)),emissive:AC,emissiveIntensity:0.55}) : mat(z.type);
      const m=ext(pts,h,base+slab,mm); m.userData={fi,zid:z.id}; grp.add(m); R.pick.push(m);
      if(isSel){ grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),selEdge)); }
      else if(z.type!=='unit'||f.level===curLv){ grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edge)); }
      sel.filter(s=>s.k==='wall'&&s.fid===f.id&&s.id===z.id).forEach(s=>{ const g=wallSeg(z,s.side), L=segLen(g), horiz=g[1]===g[3];
        const b=new THREE.Mesh(new THREE.BoxGeometry(horiz?L:0.22, h+0.1, horiz?0.22:L), wallMat); b.position.set((g[0]+g[2])/2, base+slab+h/2, -(g[1]+g[3])/2); grp.add(b); });
    });
  });
  rebuildPins3D();
}
function rebuildPins3D(){
  if(!R) return; const host=$('pins3d'); host.innerHTML=''; R.pins=[]; const cutOn=$('cutOn').checked, curLv=F().level;
  (doc.comments||[]).forEach(c=>{ if(c.status==='done'&&cmtFilterOpen) return; const t=(c.targets||[])[0]; if(!t) return;
    const fi=floorIdx(t.floor); if(fi<0) return; if(cutOn && doc.floors[fi].level>curLv) return;
    const live=targetInfo({k:t.kind,fid:t.floor,id:t.zoneId,side:t.side}) || t; const v=anchor3D(live); if(!v) return;
    const d=document.createElement('div'); d.className='pin3d'+(c.status==='done'?' done':''); d.textContent=`#${c.n}${c.targets.length>1?' +'+(c.targets.length-1):''}`; d.title=c.text;
    d.onclick=()=>focusComment(c.id); host.appendChild(d); R.pins.push({d,v}); });
  positionPins3D();
}
function positionPins3D(){ if(!R||!R.pins) return; const C=$('center').getBoundingClientRect();
  R.pins.forEach(({d,v})=>{ const q=v.clone().project(R.cam); if(q.z>1){ d.style.display='none'; return; } d.style.display=''; d.style.left=((q.x+1)/2*C.width)+'px'; d.style.top=((1-q.y)/2*C.height)+'px'; }); }
function resize3D(){ if(!R) return; const r=$('center').getBoundingClientRect(); R.renderer.setSize(r.width,r.height); R.cam.aspect=r.width/r.height; R.cam.updateProjectionMatrix(); }
['cutOn','unitsOnly'].forEach(id=>$(id).addEventListener('change',rebuild3D));

/* ---------- tabs & misc ---------- */
function setTab(t){ tab=t; [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('planPane').classList.toggle('on',t==='plan'); $('v3d').classList.toggle('on',t==='3d'); $('sumPane').classList.toggle('on',t==='sum');
  if(t==='3d'){ if(!window.THREE){ $('v3d').innerHTML='<div style="padding:24px;color:var(--muted)">3D 라이브러리(three.js)를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>'; return; } init3D(); resize3D(); rebuild3D(); }
  if(t==='sum') renderSummary(); if(t==='plan') drawPlan(); closeComposer(); updateAsk(); }
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setTab(b.dataset.t); });
let tt; function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'),2200); }
function renderAll(opts={}){ renderFloors(); renderPalette(); syncSeg3(); renderSide(); renderComments(); if(opts.fit) fit(); else drawPlan(); drawNorth();
  if(tab==='3d') rebuild3D(); if(tab==='sum') renderSummary(); updateAsk(); $('undoBtn').disabled=!undo.length; $('redoBtn').disabled=!redo.length; }
function drawNorth(){ // north arrow in uv view: north (display -y) expressed in uv
  const fr=doc.frame; const u=fr.uAxisDisplay, v=fr.vAxisDisplay; const N=[0,-1]; const nu=N[0]*u[0]+N[1]*u[1], nv=N[0]*v[0]+N[1]*v[1];
  const a=Math.atan2(nu,nv)*180/Math.PI; $('north').innerHTML=`<circle r="21" fill="var(--panel)" stroke="var(--line)"/><g transform="rotate(${a})"><path d="M0,-16 L6,8 L0,4 L-6,8Z" fill="var(--ink)"/><text y="-17" font-size="9" text-anchor="middle" fill="var(--ink)" font-weight="700" transform="translate(0,-1)">N</text></g>`; }
$('fitBtn').onclick=fit; $('undoBtn').onclick=doUndo; $('redoBtn').onclick=doRedo;
['ghostOn','stallOn'].forEach(id=>$(id).addEventListener('change',drawPlan));
$('themeBtn').onclick=()=>{ const r=document.documentElement; const c=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=c==='dark'?'light':'dark'; renderAll(); if(R){ R.scene.background=new THREE.Color(css('--canvas')); } };
$('expBtn').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(doc,null,1)],{type:'application/json'})); a.download='상봉동_116-49_zoning.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); };
$('impFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(d.schema!==DEFAULT.schema) throw new Error('스키마가 다릅니다'); commit(); doc=d; cur=0; setSel([]); changed({fit:true}); toast('불러왔습니다'); }catch(err){ toast('불러오기 실패: '+err.message); } e.target.value=''; };
$('resetBtn').onclick=()=>{ if(!confirm('기본 초안으로 되돌립니다. (되돌리기 가능)')) return; commit(); const keep=doc.comments||[]; doc=clone(DEFAULT); doc.comments=keep; cur=doc.floors.findIndex(f=>f.id==='3F'); setSel([]); changed({fit:true}); };
window.addEventListener('resize',()=>{ updateAsk(); if(tab==='plan'){ const B=box(), r=B.w/B.h, cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; vb.h=vb.w/r; vb.y=cy-vb.h/2; applyVB(); } resize3D(); });

renderAll({fit:true}); loadFromServer();
svg.addEventListener('contextmenu',e=>e.preventDefault());
</script>
<script>
window.requestDescribe=el=>{ try{ const h=el.closest('[data-id]'); if(h&&doc){ const z=F().zones.find(q=>q.id===h.getAttribute('data-id')); if(z) return {label:`${F().id} · ${z.name}`,floor:F().id,zoneId:z.id}; } return null; }catch(e){ return null; } };
window.requestFocus=t=>{ try{ if(!t.floor||!t.zoneId) return false; const fi=doc.floors.findIndex(f=>f.id===t.floor); if(fi<0) return false; cur=fi; setSel([{k:'zone',fid:t.floor,id:t.zoneId}]); renderAll({}); return true; }catch(e){ return false; } };
</script>
