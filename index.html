<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 허브</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#fff; --ink:#1d2326; --muted:#5f6b70; --line:#d9d5cc; --chip:#eef1f3;
  --accent:#1f4fd1; --ok:#1f7a4c; --warn:#b26a00; --bad:#d92d20; --askc:#f0507a; --ask1:#ff7a45; --ask2:#e8467c;
  --s-done:#1f7a4c; --s-active:#1f4fd1; --s-planned:#8a949a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15191b; --panel:#1d2225; --ink:#e7ecee; --muted:#9aa6ab; --line:#333b3f; --chip:#262d31;
  --accent:#7aa2ff; --ok:#5fd39a; --warn:#f0b44c; --bad:#ff6b5e; --s-done:#5fd39a; --s-active:#7aa2ff; --s-planned:#7d878c;}}
:root[data-theme="dark"]{
  --bg:#15191b; --panel:#1d2225; --ink:#e7ecee; --muted:#9aa6ab; --line:#333b3f; --chip:#262d31;
  --accent:#7aa2ff; --ok:#5fd39a; --warn:#f0b44c; --bad:#ff6b5e; --s-done:#5fd39a; --s-active:#7aa2ff; --s-planned:#7d878c;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header h1{margin:0;font-size:24px;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:13px}
.sp{flex:1}
.srv{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px}
.srv i{width:9px;height:9px;border-radius:50%;background:var(--muted)} .srv.on i{background:var(--ok)} .srv.off i{background:var(--bad)} .srv.busy i{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn:disabled,.btn.dis{opacity:.45;pointer-events:none}
h2{font-size:15px;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
h2 small{color:var(--muted);font-weight:400;font-size:12.5px}
.draft{font-size:11px;font-weight:700;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:999px;padding:1px 8px}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:26px;position:relative}
.stage{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 13px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:236px;transition:border-color .15s, box-shadow .15s}
.stage:hover{border-color:var(--muted)}
.stage.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.stage.planned{border-style:dashed;background:transparent}
.stage:not(:last-child)::after{content:"";position:absolute;right:-24px;top:34px;width:22px;height:2px;background:var(--line)}
.stage:nth-child(6n)::after,.stage:nth-child(6n)::before{display:none}
.stage:not(:last-child)::before{content:"";position:absolute;right:-25px;top:30px;border:5px solid transparent;border-left:7px solid var(--line);border-right:0}
.no{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;background:var(--s-planned);flex:none}
.done .no{background:var(--s-done)} .active .no{background:var(--s-active)}
.st-h{display:flex;align-items:center;gap:8px}
.st-h b{font-size:15px}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.done{color:var(--s-done);background:color-mix(in srgb,var(--s-done) 14%,transparent)} .chip.active{color:var(--s-active);background:color-mix(in srgb,var(--s-active) 14%,transparent)}
.outs{margin:0;padding-left:16px;color:var(--muted);font-size:12.5px}
.outs li{margin:1px 0}
.met{display:flex;flex-wrap:wrap;gap:4px}
.m{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.m b{font-weight:800}
.m.ask{background:var(--askc);color:#fff} .m.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)} .m.bad{background:var(--bad);color:#fff} .m.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.stage .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.store{font-size:11.5px;color:var(--muted)}
/* detail */
.detail{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.detail h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:13px}
.kv span{color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--chip);border-radius:5px;padding:1px 5px;word-break:break-all}
.say{display:flex;align-items:center;gap:8px;border:1.5px solid color-mix(in srgb,var(--askc) 45%,transparent);background:color-mix(in srgb,var(--askc) 7%,var(--panel));border-radius:10px;padding:9px 11px;margin-top:10px}
.say q{font-weight:800;quotes:"“" "”"}
.ins{display:flex;gap:6px;flex-wrap:wrap}
.ins a{text-decoration:none}
/* flow */
.flow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;overflow-x:auto}
.flow svg{display:block;width:100%;min-width:900px;height:auto}
.fn{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.fn.page{stroke:var(--accent)} .fn.data{fill:color-mix(in srgb,var(--ok) 9%,var(--panel));stroke:var(--ok)} .fn.tool{fill:color-mix(in srgb,var(--warn) 9%,var(--panel));stroke:var(--warn)} .fn.you{fill:color-mix(in srgb,var(--askc) 10%,var(--panel));stroke:var(--askc)} .fn.plan{stroke-dasharray:6 4}
.ft{fill:var(--ink);font-size:13px;font-weight:700}
.fs{fill:var(--muted);font-size:11.5px}
.fe{stroke:var(--muted);stroke-width:1.6;fill:none}
.fe.ask{stroke:var(--askc);stroke-dasharray:5 4} .fe.auto{stroke:var(--ok)} .fe.plan{stroke-dasharray:4 4}
.fl{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 4px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:5px}

/* data map */
.dwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.dmap{position:relative;min-width:1320px;padding:14px 16px 18px}
#dedges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lanes{position:relative;display:grid;grid-template-columns:repeat(var(--nl,5),minmax(0,1fr));gap:40px;z-index:1}
.lane{display:flex;flex-direction:column;gap:22px;justify-content:space-around}
.lane h5{margin:0 0 -8px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.dnode{background:var(--panel);border:1.6px solid var(--line);border-radius:12px;padding:8px 9px 9px;cursor:pointer;transition:opacity .15s,border-color .15s,box-shadow .15s}
.dnode:hover{border-color:var(--muted)}
.dnode.page{border-color:color-mix(in srgb,var(--accent) 70%,var(--line))} .dnode.data{border-color:color-mix(in srgb,var(--ok) 70%,var(--line))} .dnode.tool{border-color:color-mix(in srgb,var(--warn) 70%,var(--line))} .dnode.you{border-color:color-mix(in srgb,var(--askc) 70%,var(--line))} .dnode.planned{border-style:dashed}
.dnode.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.dmap.focus .dnode:not(.hl){opacity:.32}
.dthumb{height:104px;border-radius:8px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.dthumb svg{width:100%;height:100%;display:block}
.dt{font-size:13px;font-weight:800;display:flex;gap:6px;align-items:center}
.dk{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;background:var(--chip);color:var(--muted)}
.dp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--muted);margin-top:2px;word-break:break-all;line-height:1.35}
.de{fill:none;stroke-width:1.8;transition:opacity .15s}
.de.auto{stroke:var(--ok)} .de.manual{stroke:var(--muted)} .de.claude{stroke:var(--askc);stroke-dasharray:6 4} .de.planned{stroke:var(--muted);stroke-dasharray:2 4}
.dmap.focus .de:not(.hl){opacity:.12}
.dl{font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round;opacity:0}
.dl.auto{fill:var(--ok)} .dl.manual{fill:var(--muted)} .dl.claude{fill:var(--askc)} .dl.planned{fill:var(--muted)}
.dmap.focus .dl.hl{opacity:1}
.dpanel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.dpanel h3{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:center}
.chain{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
.chain li{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.chain li i{font-style:normal;font-weight:800;text-align:center}
.mode{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:4px}
.mode.auto{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)} .mode.manual{color:var(--muted);background:var(--chip)} .mode.claude{color:var(--askc);background:color-mix(in srgb,var(--askc) 12%,transparent)} .mode.planned{color:var(--muted);background:var(--chip)}
pre.snip{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.45;max-height:360px;overflow:auto;white-space:pre}
.snip .k{color:var(--accent)} .snip .s{color:var(--ok)} .snip .n{color:var(--warn)} .snip .c{color:var(--muted)}
@media (max-width:1100px){ .dpanel{grid-template-columns:1fr} }
/* tables & template */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h4{margin:0 0 6px;font-size:13.5px}
.card ul{margin:0;padding-left:17px;font-size:13px}
.card li{margin:3px 0}
.foot{color:var(--muted);font-size:12px;margin-top:26px}
/* md viewer */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:14px;max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.sheet header{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.md{overflow:auto;padding:6px 26px 26px;font-size:14px}
.md table{font-size:12.5px;margin:10px 0}
.md h1{font-size:21px} .md h2{font-size:17px;margin-top:24px} .md h3{font-size:15px}
@media (max-width:1100px){ .pipe{grid-template-columns:repeat(3,minmax(0,1fr))} .stage:nth-child(3n)::after,.stage:nth-child(3n)::before{display:none} .detail{grid-template-columns:1fr} }
@media (max-width:640px){ .pipe{grid-template-columns:1fr} .stage::after,.stage::before{display:none} .cols{grid-template-columns:1fr} .wrap{padding:16px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="sub" id="pAddr">불러오는 중…</div>
      <h1 id="pName">작업 허브</h1>
    </div>
    <span class="sp"></span>
    <span class="srv" id="srv"><i></i><span>서버 확인 중…</span></span>
    <a class="btn" href="workflow.json" target="_blank" title="이 허브가 읽는 워크플로 정의 (초안)">workflow.json</a>
    <button class="btn" id="themeBtn" title="밝게/어둡게">◐</button>
  </header>

  <h2>워크플로 <small>왼쪽에서 오른쪽으로 — 앞 단계의 결과가 다음 단계의 입력이 됩니다. 카드를 누르면 자세히 보입니다.</small></h2>
  <div class="pipe" id="pipe"></div>
  <div class="detail" id="detail"></div>

  <h2>데이터 흐름 <small>카드를 누르면 그 데이터가 어디서 오고, 여기서 고치면 무엇이 어떻게 이어서 바뀌는지 보입니다</small></h2>
  <div class="dwrap"><div class="dmap" id="dmap"><svg id="dedges" aria-hidden="true"></svg><div class="lanes" id="lanes"></div></div></div>
  <div class="legend"><span><i style="border-color:var(--accent)"></i>작업 페이지 (편집하는 곳)</span><span><i style="border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)"></i>데이터 (원본·결과)</span><span><i style="border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)"></i>생성기</span><span><i style="border-color:var(--askc);background:color-mix(in srgb,var(--askc) 12%,transparent)"></i>Claude</span>
    <span><b style="color:var(--ok)">━</b> 자동</span><span><b style="color:var(--muted)">━</b> 수동으로 옮김</span><span><b style="color:var(--askc)">┅</b> 요청 → Claude 반영</span><span><b style="color:var(--muted)">┈</b> 예정</span></div>
  <div class="dpanel" id="dpanel"></div>

  <h2>로컬 서버 <small id="srvNote"></small></h2>
  <div class="card"><table><thead><tr><th style="width:110px">방식</th><th style="width:220px">주소</th><th>하는 일</th></tr></thead><tbody id="eps"></tbody></table></div>

  <h2>템플릿화 메모 <span class="draft">초안 · 확정 전</span> <small>작업하면서 계속 다듬습니다</small></h2>
  <div class="cols" id="tpl"></div>

  <div class="foot" id="foot"></div>
</div>

<div class="modal" id="modal"><div class="sheet"><header><b id="mdTitle"></b><span class="sp"></span><a class="btn" id="mdRaw" target="_blank">원문</a><button class="btn" id="mdClose">닫기</button></header><div class="md" id="mdBody"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(+n).toLocaleString('ko-KR');
const when=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'—';
const STATUS={done:'완료',active:'진행 중',planned:'예정'};
let WF=null, SUM=null, STAT=null, selId=null;
try{ selId=localStorage.getItem('hub-sel'); }catch(e){}

async function load(){
  try{ WF=await (await fetch('workflow.json',{cache:'no-store'})).json(); }catch(e){ $('pipe').innerHTML='<div class="card">workflow.json을 읽지 못했습니다. 로컬 서버 주소(http://localhost:8766/)로 열어 주세요.</div>'; return; }
  $('pName').textContent=WF.project.name+' · 작업 허브'; $('pAddr').textContent=`${WF.project.address} · ${WF.project.zone}`;
  document.title=WF.project.prefix.replace(/_/g,' ')+' 작업 허브';
  if(!selId||!WF.stages.some(s=>s.id===selId)) selId=(WF.stages.find(s=>s.status==='active')||WF.stages[0]).id;
  renderEps(); renderTpl(); render(); dmLoad(); refresh(); setTimeout(refresh,1500); setInterval(refresh,10000);
}
async function refresh(){
  try{ STAT=await (await fetch('/api/status',{cache:'no-store'})).json(); SUM=await (await fetch('/api/summary',{cache:'no-store'})).json(); }
  catch(e){ STAT=null; SUM=null; }
  const s=$('srv'); s.className='srv '+(!STAT?'off':STAT.regenerating?'busy':'on');
  s.querySelector('span').textContent=!STAT?'로컬 서버 꺼짐 — Claude에게 “로컬호스트 다시 띄워줘”':STAT.regenerating?'계획설계 다시 생성 중…':'로컬 서버 켜짐 · '+location.host;
  $('srvNote').textContent=STAT?`마지막 자동 재생성 ${STAT.lastAuto||'—'} · 계획설계는 조닝 ${STAT.planZoning===STAT.zoningUpdated?'최신 기준':'이전 기준 (다시 생성 필요)'}`:'꺼져 있으면 저장·재생성이 되지 않습니다';
  render();
}
function metrics(st){ const z=SUM&&SUM.zoning, p=SUM&&SUM.plan, lg=SUM&&SUM.legal, rq=(SUM&&SUM.requests)||{}; const m=[];
  const fs=p&&p.disciplines&&p.disciplines.fire;
  if(st.id==='fire'&&fs){ m.push(fs.warn?`<span class="m warn">경고 ${fs.warn}</span>`:`<span class="m ok">경고 0</span>`); m.push(`<span class="m">보행거리 <b>${(+fs.maxTravel).toFixed(1)}</b>/${fs.travelLimit}m</span>`); m.push(`<span class="m">방화문 지정 ${fs.doorChanges}</span>`); m.push(`<span class="m">헤드 ${fs.sprinklers.toLocaleString()}</span>`); }
  const ms=p&&p.disciplines&&p.disciplines.mep, ss=p&&p.disciplines&&p.disciplines.struct;
  if(st.id==='mep'&&ms){ m.push(ms.warn?`<span class="m warn">경고 ${ms.warn}</span>`:`<span class="m ok">경고 0</span>`); m.push(`<span class="m">변압기 <b>${(ms.transformer||0).toLocaleString()}</b>kVA</span>`); m.push(`<span class="m">저수조 ${Math.round(ms.tank)}m³</span>`); m.push(`<span class="m">입상관 어긋남 ${ms.offsets}/${ms.stacks}</span>`); }
  if(st.id==='struct'&&ss){ m.push(ss.warn?`<span class="m warn">경고 ${ss.warn}</span>`:`<span class="m ok">경고 0</span>`); m.push(`<span class="m">${ss.transferFloor} 전이 · 보 ${ss.transfers}</span>`); m.push(`<span class="m">${ss.underFloor} 천장고 <b>${(+ss.clear).toFixed(2)}</b>/${ss.clearMin}m</span>`); m.push(`<span class="m">기둥 ${ss.columns}</span>`); }
  const cs=p&&p.disciplines&&p.disciplines.cost;
  if(st.id==='cost'&&cs){ m.push(`<span class="m">총 <b>${(cs.total/1e8).toFixed(0)}</b>억</span>`); m.push(`<span class="m">평당 ${Math.round(cs.perPyeong/1e4).toLocaleString()}만</span>`); m.push(`<span class="m">기본형건축비 ${Math.round(cs.benchRatio*100)}%</span>`); }
  if(st.id==='legal'&&lg&&lg.total){ m.push(lg.bad?`<span class="m bad">부적합 ${lg.bad}</span>`:`<span class="m ok">부적합 0</span>`); if(lg.chk) m.push(`<span class="m warn">확인 필요 ${lg.chk}</span>`); if(lg.proc) m.push(`<span class="m">절차 ${lg.proc}</span>`); m.push(`<span class="m">적합 <b>${lg.ok}</b> / ${lg.total}</span>`); }
  if(st.dockPage&&rq[st.dockPage]) m.push(`<span class="m ask">요청 바 ${rq[st.dockPage]}</span>`);
  if(st.id==='zoning'&&z&&!z.error){ m.push(`<span class="m">층 <b>${z.floors}</b></span>`,`<span class="m">구역 <b>${fmt(z.zones)}</b></span>`,`<span class="m">세대 <b>${z.units}</b></span>`); if(z.openComments) m.push(`<span class="m ask">요청 ${z.openComments}</span>`); }

function markFocus(){ const id=DM.sel; if(!id) return; const dn=chainFrom(id,1), up=chainFrom(id,-1); const nodes=new Set([...dn.nodes,...up.nodes]); const E=WF.dataflow.edges; const es=new Set([...dn.steps,...up.steps].map(e=>E.indexOf(e)));
  $('dmap').classList.add('focus'); document.querySelectorAll('.dnode').forEach(el=>{ el.classList.toggle('hl',nodes.has(el.dataset.n)); el.classList.toggle('sel',el.dataset.n===id); });
  document.querySelectorAll('#dedges [data-e]').forEach(el=>el.classList.toggle('hl',es.has(+el.dataset.e))); }
function focusNode(id,scroll=true){ DM.sel=id; const n=WF.dataflow.nodes.find(x=>x.id===id); if(!n) return; markFocus();
  const byId=x=>WF.dataflow.nodes.find(q=>q.id===x); const dn=chainFrom(id,1), up=chainFrom(id,-1);
  const step=(e,i)=>`<li><i>${i+1}</i><div><b>${esc(byId(e[0]).title)}</b> → <b>${esc(byId(e[1]).title)}</b><span class="mode ${e[3]}">${MODE[e[3]]}</span><br><span style="color:var(--muted)">${esc(e[2])}</span></div></li>`;
  const sn=snippet(n);
  $('dpanel').innerHTML=`<div>
      <h3>${esc(n.title)} <span class="dk">${KIND[n.kind]||n.kind}</span></h3>
      <div class="kv"><span>위치</span><div><code>${esc(n.path)}</code></div><span>담는 것</span><div>${esc(n.what)}</div><span>고치는 곳</span><div><b>${esc(n.edit)}</b></div></div>
      <h4 style="margin:14px 0 2px;font-size:13.5px">여기서 고치면 이어서 바뀌는 것</h4>
      ${dn.steps.length?`<ol class="chain">${dn.steps.map(step).join('')}</ol>`:'<div class="empty" style="color:var(--muted);font-size:13px">이어지는 단계 없음 (최종 결과)</div>'}
      <h4 style="margin:14px 0 2px;font-size:13.5px">이 데이터를 만드는 것</h4>
      ${up.steps.length?`<ol class="chain">${up.steps.map(step).join('')}</ol>`:'<div style="color:var(--muted);font-size:13px">시작점 (원자료)</div>'}
    </div>
    <div><h4 style="margin:0 0 6px;font-size:13.5px">구성 미리보기 <span style="font-weight:400;color:var(--muted);font-size:12px">— 실제 데이터에서 일부만 잘라 보여 줌</span></h4><pre class="snip">${sn.lang==='json'?hl(sn.t):esc(sn.t)}</pre></div>`;
  if(scroll) $('dpanel').scrollIntoView({block:'nearest',behavior:'smooth'}); }
document.addEventListener('click',e=>{ const n=e.target.closest('.dnode'); if(n) focusNode(n.dataset.n); });
window.addEventListener('resize',()=>requestAnimationFrame(drawEdges));

load();
</script>
<script src="assets/request-dock.js" data-page="hub" data-title="작업 허브"></script>
</body>
</html>
